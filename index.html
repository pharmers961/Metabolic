<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metabolic Method Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MM Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0A; --surface:#16150F; --surface2:#1F1D13; --line:#2B2919;
  --gold:#F2C230; --gold-dim:#C9A426; --bone:#EDE8DA; --muted:#9A9480;
  --green:#57C288; --red:#E2604C;
  --disp:'Anton',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.02em;text-transform:uppercase}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
input,select,textarea{font-family:var(--body);background:var(--surface2);border:1px solid var(--line);color:var(--bone);
  border-radius:8px;padding:10px 12px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.screen{display:none;padding:18px 16px 24px;max-width:560px;margin:0 auto}
.screen.on{display:block}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.pagehead{margin-bottom:16px}
.pagehead h1{font-size:30px;line-height:1.05;margin-top:4px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--gold);color:#141204;font-weight:700;border-radius:10px;padding:13px 16px;font-size:15px;width:100%;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--bone);border:1px solid var(--line);font-weight:600}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.4}
.btn,.card,.daycard,.setrow{scroll-margin:96px} /* keep focused/scrolled targets clear of the fixed nav */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;min-height:36px}
.pill.on{background:var(--gold);color:#141204;border-color:var(--gold)}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--gold);border:1px solid var(--line);
  background:var(--surface2);border-radius:999px;padding:2px 10px}
/* day cards */
.daycard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.daycard .dnum{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.1em}
.daycard .dname{font-family:var(--disp);font-size:20px;margin-top:2px}
.daycard .dmeta{color:var(--muted);font-size:12.5px;margin-top:4px}
.daycard.next{border-color:var(--gold-dim)}
.daycard.recovery{background:transparent;border-style:dashed}
.daycard .badge{position:absolute;top:12px;right:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--gold)}
.daycard .badge.done{color:var(--green)}
/* resume banner */
#banner{position:sticky;top:0;z-index:30;display:none;background:var(--surface2);border-bottom:1px solid var(--gold-dim);
  padding:10px 16px}
#banner.on{display:block}
#banner .row{max-width:560px;margin:0 auto}
/* today */
.hero{background:var(--surface);border:1px solid var(--gold-dim);border-radius:16px;padding:16px;margin-bottom:12px}
.hero .h-eyebrow{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.08em}
.hero h2{font-size:26px;margin:4px 0 10px;line-height:1.05}
.statrow{display:flex;gap:8px;margin-bottom:12px}
.tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--mono);font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.weekstrip{display:flex;gap:6px;justify-content:space-between}
.weekstrip .wd{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.weekstrip .wd .dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);margin:4px auto 0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.weekstrip .wd .dot.did{background:var(--gold);border-color:var(--gold);color:#141204;font-weight:700}
.weekstrip .wd .dot.plan{border-color:var(--gold-dim);color:var(--gold)}
.weekstrip .wd.today .lbl{color:var(--gold);font-weight:700}
/* training */
.exname{font-weight:600;font-size:15px}
button.exname{padding:0;text-align:left;text-decoration:underline dotted var(--gold-dim);text-underline-offset:3px}
.exmeta{font-family:var(--mono);font-size:12.5px;color:var(--gold-dim);margin-top:2px}
.exmeta .sugg{color:var(--gold)}
.lastlog{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.ssflag{font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;font-weight:700}
.roundlbl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px;letter-spacing:.08em}
.setrow{display:grid;grid-template-columns:22px 32px minmax(0,1.15fr) 32px minmax(0,.9fr) 46px;gap:6px;align-items:center;margin-top:8px}
.setrow.rpe{grid-template-columns:22px 32px minmax(0,1fr) 32px minmax(0,.75fr) 44px 46px}
.setrow .sn{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.setrow input{padding:10px 6px;text-align:center;min-height:44px}
.setrow input.rpein{font-family:var(--mono)}
.step{width:32px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);font-size:17px;font-weight:700}
.tick{width:46px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);font-size:18px;font-weight:700}
.tick.done{background:var(--green);border-color:var(--green);color:#062012}
.colhead{display:grid;grid-template-columns:22px 32px minmax(0,1.15fr) 32px minmax(0,.9fr) 46px;gap:6px;font-size:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-top:10px;text-align:center;font-weight:600}
.colhead.rpe{grid-template-columns:22px 32px minmax(0,1fr) 32px minmax(0,.75fr) 44px 46px}
.excard.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.excard.folded .fold-body{display:none}
.foldsum{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0}
.foldsum .ok{color:var(--green);font-weight:700}
.foldsum .best{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.notebox{margin-top:10px}
.notebox textarea{font-size:13.5px;min-height:52px}
.wu{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.wu:last-child{border-bottom:none}
.wu .wbox{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px}
.wu.done .wbox{background:var(--green);border-color:var(--green);color:#062012}
.wu.done .wt{color:var(--muted);text-decoration:line-through}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.jumpbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.jumpbar::-webkit-scrollbar{display:none}
.jchip{flex:0 0 auto;min-width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--muted);font-family:var(--mono);font-size:12.5px;font-weight:600}
.jchip.done{color:var(--green);border-color:var(--green)}
.jchip.cur{background:var(--gold);color:#141204;border-color:var(--gold)}
.tbtn{min-height:44px;border-radius:9px;border:1px solid var(--gold-dim);background:var(--surface2);
  color:var(--gold);font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px}
.vbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--gold-dim);color:var(--gold);font-size:10px;
  text-decoration:none;vertical-align:2px;margin-left:4px}
.setrow{transition:transform .15s}
.pbar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pbar>div{height:100%;background:var(--gold);width:0;transition:width .3s}
.sessmeta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
/* overflow menu */
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:44px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  min-width:200px;z-index:20;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:none}
.menu button.dngr{color:var(--red)}
/* commitment ring + journey */
.ringwrap{display:flex;align-items:center;gap:14px}
.cring{width:78px;height:78px;flex:0 0 auto}
.cring text{font-family:var(--mono);fill:var(--bone);font-size:17px;font-weight:600}
.journey{display:flex;gap:5px;margin-top:12px}
.jseg{flex:1;display:flex;gap:2px;align-items:center}
.jtick{flex:1;height:7px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.jtick.done{background:var(--gold);border-color:var(--gold)}
.jtick.half{background:var(--gold-dim);border-color:var(--gold-dim);opacity:.55}
.jlbl{display:flex;gap:5px;margin-top:4px}
.jlbl span{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.jlbl span.cur{color:var(--gold);font-weight:600}
/* PR / celebration overlay */
#prOverlay{position:fixed;inset:0;z-index:80;background:rgba(9,9,7,.97);display:none;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#prOverlay.on{display:flex}
#prOverlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.prbox{position:relative;max-width:340px}
.prbox .pre{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
.prbox h2{font-size:30px;margin:10px 0 2px}
.prbox .big{font-family:var(--disp);font-size:92px;color:var(--gold);line-height:1;letter-spacing:.01em}
.prbox .big .u{font-size:22px;color:var(--muted);font-family:var(--body);font-weight:600}
.prbox .beats{color:var(--muted);font-size:14px;margin-top:8px}
.prbox .btn{margin-top:22px}
.prbox .undo{margin-top:12px;color:var(--muted);font-size:13px;text-decoration:underline}
/* trophies */
.trophy{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.trophy::-webkit-scrollbar{display:none}
.tcard{flex:0 0 auto;background:var(--surface2);border:1px solid var(--gold-dim);border-radius:12px;
  padding:10px 14px;text-align:center;min-width:96px}
.tcard .tv{font-family:var(--mono);font-size:20px;color:var(--gold);font-weight:600}
.tcard .tl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:2px}
.tcard .td{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:1px}
/* plan rows */
.planrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.planrow .pd{width:74px;font-size:13px;color:var(--muted)}
.planrow .pd b{color:var(--bone);display:block;font-size:14px}
.planrow.today .pd b{color:var(--gold)}
/* rest timer overlay */
#restOverlay{position:fixed;inset:0;background:rgba(9,9,7,.96);display:none;z-index:50;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
#restOverlay.on{display:flex}
.plate{position:relative;width:min(70vw,280px);aspect-ratio:1}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate .t .big{font-family:var(--mono);font-size:54px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plate .t .lbl{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.nextup{color:var(--muted);font-size:13.5px;text-align:center}
.nextup b{color:var(--bone)}
#restOverlay .row{width:min(78vw,320px);flex-wrap:wrap}
#restOverlay .row .btn{flex:1;min-width:64px}
/* rest mini pill */
#restPill{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:45;display:none;
  background:var(--surface2);border:1px solid var(--gold-dim);border-radius:999px;padding:10px 10px 10px 18px;
  align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:536px;margin:0 auto}
#restPill.on{display:flex}
#restPill .tm{font-family:var(--mono);font-size:20px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
#restPill .nx{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restPill button{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
/* bottom sheet */
#sheetWrap{position:fixed;inset:0;z-index:60;display:none}
#sheetWrap.on{display:block}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
  max-height:82vh;overflow-y:auto}
#sheet h2{font-size:22px;margin-bottom:10px}
/* toasts */
#toasts{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column;gap:8px;max-width:536px;margin:0 auto;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:auto;font-size:14px}
.toast.gold{border-color:var(--gold)}
.toast .act{color:var(--gold);font-weight:700;padding:4px 8px;flex:0 0 auto}
/* calendar */
.cal{margin-top:10px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead .m{font-family:var(--disp);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.calhead button{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);min-height:40px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .dow{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0;font-weight:600}
.calcell{aspect-ratio:1;min-height:44px;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:13px;color:var(--muted);font-family:var(--mono);position:relative;
  font-variant-numeric:tabular-nums;background:none;width:100%}
.calcell.inmonth{color:var(--bone)}
.calcell.did{background:var(--surface2);border-color:var(--gold);color:var(--gold);font-weight:600}
.calcell.today{border-color:var(--bone)}
.calcell.plan::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold-dim);position:absolute;bottom:5px}
.calcell.missed{color:var(--red)}
/* charts */
.chart{margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.spark{margin-top:6px}
/* history */
.hsession{border-bottom:1px solid var(--line);padding:12px 0}
.hsession:last-child{border-bottom:none}
.wkhead{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.06em;margin:16px 0 2px}
.wkhead:first-child{margin-top:0}
.wkhead .wsub{color:var(--muted)}
/* stats */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:none}
.stat .v{font-family:var(--mono);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat .u{font-size:12px;color:var(--muted);margin-left:4px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.togglerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.togglerow:last-child{border-bottom:none}
.togglerow .tl{font-size:14px}
.togglerow .td{font-size:12px;color:var(--muted);margin-top:1px}
code{font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all}
details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--bone);list-style-position:outside}
.searchbox{position:relative;margin-bottom:12px}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:600;font-size:13.5px;
  padding:6px 0;margin-bottom:6px}
.plist button.prow{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.plist button.prow:last-child{border-bottom:none}
.plist .prsub{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#111009;border-top:1px solid var(--line);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;min-height:52px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--gold)}
/* wide screens: session in two columns */
@media (min-width:760px){
  .screen{max-width:760px}
  #banner .row,#restPill,#toasts{max-width:736px}
  .twocol{column-count:2;column-gap:12px}
  .twocol>.card,.twocol>div{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="banner" role="status"></div>

<section class="screen on" id="scr-today" aria-label="Today"></section>
<section class="screen" id="scr-train" aria-label="Train"></section>
<section class="screen" id="scr-program" aria-label="Program"></section>
<section class="screen" id="scr-stats" aria-label="Stats"></section>
<section class="screen" id="scr-settings" aria-label="Settings"></section>

<!-- Rest timer overlay -->
<div id="restOverlay" role="dialog" aria-modal="true" aria-label="Rest timer">
  <div class="plate">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" stroke="#2B2919" stroke-width="5" fill="none"/>
      <circle cx="50" cy="50" r="34" stroke="#2B2919" stroke-width="2" fill="none"/>
      <circle id="ring" cx="50" cy="50" r="46" stroke="#F2C230" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/>
    </svg>
    <div class="t"><span class="lbl" id="restLbl">Rest</span><span class="big" id="restTime">0:00</span></div>
  </div>
  <div class="nextup" id="restNext"></div>
  <div class="nextup" id="restBeat" style="color:var(--gold)"></div>
  <div class="row">
    <button class="btn ghost" id="restMinus" aria-label="Shorten rest by 15 seconds">−15s</button>
    <button class="btn ghost" id="restPause" aria-label="Pause rest timer">Pause</button>
    <button class="btn ghost" id="restPlus" aria-label="Extend rest by 30 seconds">+30s</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="restMini">Keep logging</button>
    <button class="btn" id="restSkip">Skip</button>
  </div>
</div>

<!-- Rest mini pill -->
<div id="restPill">
  <span class="tm" id="pillTime">0:00</span>
  <button id="pillOpen" class="nx" aria-label="Open rest timer"></button>
  <button id="pillSkip">Skip</button>
</div>

<!-- PR / celebration overlay -->
<div id="prOverlay" role="dialog" aria-modal="true" aria-label="Achievement">
  <canvas id="confettiC"></canvas>
  <div class="prbox">
    <div class="pre" id="prPre">NEW PR</div>
    <h2 id="prTitle"></h2>
    <div class="big" id="prBig"></div>
    <div class="beats" id="prBeats"></div>
    <button class="btn" id="prClose">Keep going</button>
    <div><button class="undo" id="prUndo" hidden>Undo — don't save this PR</button></div>
  </div>
</div>

<!-- Bottom sheet -->
<div id="sheetWrap" role="dialog" aria-modal="true">
  <div class="backdrop" id="sheetBack"></div>
  <div id="sheet"></div>
</div>

<div id="toasts"></div>
<div id="live" class="vh" aria-live="polite"></div>

<nav aria-label="Main">
  <button data-nav="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg>Today</button>
  <button data-nav="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Train</button>
  <button data-nav="program"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17V4M9 8h6"/></svg>Program</button>
  <button data-nav="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>Settings</button>
</nav>

<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
