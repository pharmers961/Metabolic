<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metabolic Method Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0C0A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0A; --surface:#16150F; --surface2:#1F1D13; --line:#2B2919;
  --gold:#F2C230; --gold-dim:#B08E1F; --bone:#EDE8DA; --muted:#8F8A79;
  --green:#57C288; --red:#E2604C;
  --disp:'Anton',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.02em;text-transform:uppercase}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:var(--body);background:var(--surface2);border:1px solid var(--line);color:var(--bone);
  border-radius:8px;padding:10px 12px;font-size:15px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=number]{font-family:var(--mono)}
.screen{display:none;padding:18px 16px 24px;max-width:560px;margin:0 auto}
.screen.on{display:block}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.pagehead{margin-bottom:16px}
.pagehead h1{font-size:30px;line-height:1.05;margin-top:4px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.btn{background:var(--gold);color:#141204;font-weight:700;border-radius:10px;padding:13px 16px;font-size:15px;width:100%;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--bone);border:1px solid var(--line);font-weight:600}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.4}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--gold);color:#141204;border-color:var(--gold)}
.daycard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:10px}
.daycard .dnum{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em}
.daycard .dname{font-family:var(--disp);font-size:20px;margin-top:2px}
.daycard .dmeta{color:var(--muted);font-size:12px;margin-top:4px}
/* training */
.exname{font-weight:600;font-size:15px}
.exmeta{font-family:var(--mono);font-size:12px;color:var(--gold-dim);margin-top:2px}
.lastlog{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.ssflag{font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:8px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.setrow .sn{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.setrow input{padding:9px 10px;text-align:center}
.tick{width:52px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);font-size:18px;font-weight:700}
.tick.done{background:var(--green);border-color:var(--green);color:#062012}
.colhead{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;margin-top:10px;text-align:center}
.wu{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.wu:last-child{border-bottom:none}
.wu .wbox{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px}
.wu.done .wbox{background:var(--green);border-color:var(--green);color:#062012}
.wu.done .wt{color:var(--muted);text-decoration:line-through}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.pbar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pbar>div{height:100%;background:var(--gold);width:0;transition:width .3s}
/* rest timer overlay — the signature */
#restOverlay{position:fixed;inset:0;background:rgba(9,9,7,.96);display:none;z-index:50;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#restOverlay.on{display:flex}
.plate{position:relative;width:min(74vw,300px);aspect-ratio:1}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate .t .big{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.02em}
.plate .t .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.nextup{color:var(--muted);font-size:13px;text-align:center}
.nextup b{color:var(--bone)}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#111009;border-top:1px solid var(--line);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.06em;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--gold)}
/* fitbit */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:none}
.stat .v{font-family:var(--mono);font-size:20px;color:var(--gold)}
.stat .u{font-size:12px;color:var(--muted);margin-left:4px}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:10px}
.hsession{border-bottom:1px solid var(--line);padding:12px 0}
.hsession:last-child{border-bottom:none}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
code{font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all}
details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--bone)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- TRAIN -->
<section class="screen on" id="scr-train"></section>
<!-- PROGRAM -->
<section class="screen" id="scr-program"></section>
<!-- HISTORY -->
<section class="screen" id="scr-history"></section>
<!-- FITBIT -->
<section class="screen" id="scr-fitbit"></section>
<!-- SETTINGS -->
<section class="screen" id="scr-settings"></section>

<!-- Rest timer overlay -->
<div id="restOverlay" role="dialog" aria-label="Rest timer">
  <div class="plate">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" stroke="#2B2919" stroke-width="5" fill="none"/>
      <circle cx="50" cy="50" r="34" stroke="#2B2919" stroke-width="2" fill="none"/>
      <circle id="ring" cx="50" cy="50" r="46" stroke="#F2C230" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/>
    </svg>
    <div class="t"><span class="lbl">Rest</span><span class="big" id="restTime">0:00</span></div>
  </div>
  <div class="nextup" id="restNext"></div>
  <div class="row" style="width:min(74vw,300px)">
    <button class="btn ghost" id="restPlus">+30s</button>
    <button class="btn" id="restSkip">Skip</button>
  </div>
</div>

<nav>
  <button data-nav="train" class="on"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Train</button>
  <button data-nav="program"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 9h16"/></svg>Program</button>
  <button data-nav="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>History</button>
  <button data-nav="fitbit"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Fitbit</button>
  <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>Settings</button>
</nav>

<script src="app.js"></script>
</body>
</html>
